  'f = 2.4 GHz (T < 80 °C) → 1.5 GHz (T ≥ 85 °C)',
  'E = n·I·Vf·η / Ω / d²   (Ω = 1.84 sr, d = 1.2 m)',
  't_画 = 240 s · 2.4 GHz / f   (假设，待实测)',
])

const L = (obj, t, at, value, side) => lab.label(obj, t, { at, value, side })
L(head, '摄像头 · Camera Module 3 NoIR', [0, 0.012, 0.009], () => (out.capture ? '10 fps · 帧差后立即丢弃' : '待机') + (sim.lastEv && lab.time - sim.evAt < 6 ? ` · ${sim.lastEv}` : ''), 'right')
L(head, '850 nm 红外灯 ×6', [-0.016, -0.009, 0.0072], () => out.capture ? `${fmt(LED.I * 1000)} mA · 枕头处 ${fmt(out.E, 2)} W/m²` : '已关闭', 'left')
L(pi, 'BCM2712 SoC', [X(30), YT + 0.0013, Z(31)], () => `${fmt(sim.T, 1)} °C · ${fmt(sim.f, 2)} GHz`, 'right')
L(cooler, 'Active Cooler 风扇', [X(54), BH[1], Z(32.5)], () => sim.stall ? '停转' : `占空比 ${fmt(sim.duty * 100)} %`, 'left')
L(mic, 'USB 麦克风', [X(88) - 0.012, YT + 0.0146, Z(47)], () => '16 kHz → YAMNet 声音事件', 'left')
L(drv, 'LED 恒流驱动', [0.035, DT + 0.0026, 0.0333], () => out.capture ? `${fmt(out.Pled, 2)} W 输入` : '关闭', 'right')
L(pwr, 'USB-C 供电', [PX, PY + 0.0033, Z(0) - 0.012], () => `5 V · ${fmt(out.I, 2)} A`, 'right')
L(statusLed, '状态灯', [0, 0, 0.0017], () => `事件 ${sim.events}`, 'right')

// airflow: in through the top slots, down into the blower, out through the fins and the right-wall slots
const air = []
{ let s = 5; const R = () => ((s = (s * 16807) % 2147483647) / 2147483647)
  for (let i = 0; i < 40; i++) {
    const ax = X(54) + (R() - 0.5) * 0.012, az = Z(32.5) + (R() - 0.5) * 0.012, ex = Z(18 + R() * 29), ey = PLY[1] + 0.0015 + R() * (finH - 0.003)
    air.push([[ax, 0.075, az], [ax, 0.05, az], [X(54) + (ax - X(54)) * 0.4, BH[1] - 0.001, Z(32.5) + (az - Z(32.5)) * 0.4], [X(54) - 0.004, ey, lerp(Z(32.5), ex, 0.6)], [X(44), ey, ex], [X(26), ey, ex], [X(9), ey, ex], [BW / 2 + 0.004, ey, ex], [BW / 2 + 0.03, ey + 0.004, ex]])
  } }
const flow = lab.flow({ paths: air, count: 140, length: 0.08, color: (k, u) => { const w = clamp((sim.T - 30) / 50) * smoothstep(0.35, 0.6, u); return [lerp(0.25, 1.0, w), lerp(0.55, 0.55, w), lerp(1.0, 0.25, w)] }, seed: 7 })

// ------------------------------------------------------------------ run
lab.onTick((dt, lab, rdt) => {
  const u = load.value / 100
  out = solve(u)
  // thermal: explicit steps on the 20x clock
  let h = dt * SIM
  while (h > 1e-6) {
    const s = Math.min(h, 0.5); h -= s
    sim.duty = sim.stall ? 0 : table(FAN_T, FAN_D, sim.T) * (sim.T < FAN_T[0] ? 0 : 1)
    sim.f = F_MAX - (F_MAX - F_MIN) * clamp((sim.T - 80) / 5)
    const x = sim.f / F_MAX
    const P = P_IDLE + P_DYN * u * x * x
    const Rth = 1 / (1 / R0 + G_FAN * sim.duty)
    sim.T += (s * (P - (sim.T - AMB) / Rth)) / C_TH
  }
  out = solve(u)
  // fan: shown slowed (rpm is illustrative), spins down on a stall
  sim.w = approach(sim.w, sim.stall ? 0 : sim.duty * 9, 0.6, dt)
  sim.spin += sim.w * dt
  impeller.rotation.y = -sim.spin
  irGlow.emissiveIntensity = out.capture ? 0.55 : 0.02
  const evGlow = Math.exp(-(lab.time - sim.evAt) * 2.2)
  statusGlow.emissiveIntensity = 0.25 + 3.2 * evGlow + (out.capture ? 0 : 0.6 + 0.4 * Math.sin(lab.time * 3))
  flow.speed = 0.05 + 0.5 * sim.w / 9
  flow.opacity = clamp(0.25 + sim.duty) * Math.max(lab.state.cut, lab.state.xray)
  cables.visible = lab.state.explode < 0.02
  const bad = sim.T >= 80
  const st = sim.stall ? (bad ? '风扇停转 · 降频' : '风扇停转') : out.capture ? (sim.T >= 80 ? '降频' : '夜间采集') : (bad ? '降频' : '清晨生成')
  const extra = out.capture
    ? `红外 ${fmt(out.E, 2)} W/m² @ 1.2 m（限值 ${E_LIMIT}）`
    : `一幅 512² 画 ≈ ${fmt(out.gen / 60, 1)} 分钟${sim.f < F_MAX - 0.01 ? `，慢 ${fmt((F_MAX / sim.f - 1) * 100)} %` : ''}`
  const evs = sim.events ? ` · <span class="ev">事件 ${sim.events}${sim.lastEv && lab.time - sim.evAt < 6 ? '：' + sim.lastEv : ''}</span>` : ''
  lab.setHero(sim.T, { state: st, sub: `${bad ? '<span class="bad">' : ''}整机 ${fmt(out.Ptot, 1)} W · CPU ${fmt(sim.f, 2)} GHz · 风扇 ${sim.stall ? '0' : fmt(sim.duty * 100)} %${bad ? '</span>' : ''}<br>${extra}${evs}`, bad })
})

lab.breakIt({
  label: '风扇停转',
  run() { sim.stall = true },
  reset() { sim.stall = false },
})

// ------------------------------------------------------------------ events from the page (Anatomy figure -> parent -> here)
const EV = { turn: '翻身', twitch: '小动作', snore: '鼾声', door: '关门声' }
addEventListener('message', (e) => {
  if (e.source !== window.parent || e.source === window) return
  const d = e.data
  if (!d || d.ns !== 'night-canvas' || d.type !== 'event' || !(d.kind in EV)) return
  sim.events = clamp(Math.round(Number(d.count) || sim.events + 1), 0, 9999)
  sim.lastEv = EV[d.kind]; sim.evAt = lab.time
})
window.nightCanvas = { event: (kind) => { if (kind in EV) { sim.events++; sim.lastEv = EV[kind]; sim.evAt = lab.time } }, sim }

// Chinese captions for the kit's buttons and notes (the kit itself is untouched)
const ZH = { run: ['暂停', '运行'], explode: '爆炸', cut: '剖切', xray: 'X 光', slow: '慢放', labels: '标签' }
const _sync = lab._syncButtons.bind(lab)
lab._syncButtons = () => {
  _sync()
  for (const b of lab.ui.querySelectorAll('.lab-modes button')) { const k = b.dataset.k; if (k === 'run') b.firstChild.textContent = lab.paused ? ZH.run[1] : ZH.run[0]; else if (ZH[k]) b.firstChild.textContent = ZH[k] }
}
lab.$('.lab-how summary').textContent = '如何计算'
const _hud = lab._buildHUD.bind(lab)
lab._buildHUD = (A) => { _hud(A); if (lab._building) { lab.metricEl.querySelector('.lbl').firstChild.textContent = '组装中 · '; const i = lab.metricEl.querySelector('.lab-big i'); i.textContent = i.textContent.replace(/^of (.*) parts$/, '/ $1 个零件'); lab._hsub.textContent = lab._hsub.textContent.replace('triangles', '三角面').replace('materials', '种材质') } }
// glare control: only self-lit parts (status LED, IR emitters) pass the bloom threshold; the floor
// no longer mirrors the overhead softbox at grazing angles; a slightly softer key light
lab.bloom.threshold = 1.6
lab.bloom.strength = 0.18
lab.key.intensity = 2.3
lab.scene.environmentIntensity = 0.85
lab.floor.material.roughness = 0.92
lab.floor.material.envMapIntensity = 0.18
// reduced motion: no fly-in assembly and no idle orbit; every control still works
const still = matchMedia('(prefers-reduced-motion: reduce)').matches
if (still) lab.o.autoOrbit = false
lab.start()
if (still) lab._assembly = 0
// narrow screens: centre the device and lift it into the top half, clear of the readout band
const frameFor = () => innerWidth <= 760 ? lab.setView({ frameX: 0, dist: 3.5, target: [0, 0.03, -0.005] }) : lab.setView({ frameX: -0.16, dist: 2.8, target: [0, 0.09, -0.005] })
frameFor(); addEventListener('resize', frameFor)
</script>
